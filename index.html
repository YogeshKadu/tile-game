<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">
</head>

                    </span>
                </button>
            </div>
            <div class="body">
                <h2 class="text-center game-title">
                    <span class="noto">🌟</span>
                    Image Puzzle
                    <span class="noto">🌟</span>
                </h2>
                <div class="btn-group">
                    <button id="easy" class="btn btn-capsule">
                        <div class="float">
                            <p><strong>Easy</strong></p>
                            <span>3 X 3</span>
                        </div>
                    </button>
                    <button id="medium" class="btn btn-capsule">
                        <div class="float">
                            <p><strong>Medium</strong></p>
                            <span>4 X 4</span>
                        </div>
                    </button>
                    <button id="hard" class="btn btn-capsule">
                        <div class="float">
                            <p><strong>Hard</strong></p>
                            <span>6 X 6</span>
                        </div>
                    </button>
                </div>
            </div>
        </section>
        <section id="game-board" class="hidden">
            <div class="header">
                <button id="back-button" class="btn btn-circle">
                    <span class="float">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />

                    </span>

                <button id="help" class="btn btn-circle">
                    <span class="float">
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path d="M0 0h24v24H0z" fill="none" />
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.195 8.765A4 4 0 1 1 12 14v1m.05 4v.1h-.1V19z" />

                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 48 48">
                            <path d="M0 0h48v48H0z" fill="none" />
                            <path fill="currentColor" d="M25.081 6.419C26.208 5.408 28 6.207 28 7.72v32.56c0 1.514-1.792 2.313-2.919 1.302l-8.206-7.366A4.75 4.75 0 0 0 13.702 33H9a5.25 5.25 0 0 1-5.25-5.25v-7.5C3.75 17.35 6.1 15 9 15h4.702a4.75 4.75 0 0 0 3.173-1.216zm.419 2.983l-6.955 6.244a7.25 7.25 0 0 1-4.843 1.854H9a2.75 2.75 0 0 0-2.75 2.75v7.5A2.75 2.75 0 0 0 9 30.5h4.702a7.25 7.25 0 0 1 4.843 1.855L25.5 38.6zm6.866 8.965a1.25 1.25 0 0 1 1.768 0L38 22.233l3.866-3.866a1.25 1.25 0 1 1 1.768 1.767L39.768 24l3.866 3.867a1.25 1.25 0 0 1-1.768 1.767L38 25.768l-3.866 3.866a1.25 1.25 0 0 1-1.768-1.767L36.232 24l-3.866-3.866a1.25 1.25 0 0 1 0-1.767" />

            <div class="body">
                <div id="board">
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="./script.js"></script>

</html>
