<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Drag and Drop List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }

    .sortable-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 400px;
    }

    .sortable-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 14px 16px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: grab;
      user-select: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .sortable-item:active {
      cursor: grabbing;
    }

    .drag-handle {
      color: #777;
      font-size: 20px;
    }

    .sortable-item.dragging {
      opacity: 0.4;
      transform: scale(1.02);
    }
  </style>
</head>

<body>
  <h2>Rearrange the list</h2>

  <ul id="sortableList" class="sortable-list">
    <li class="sortable-item" draggable="true" data-id="1">
      <span class="drag-handle">☰</span>
      Design
    </li>

    <li class="sortable-item" draggable="true" data-id="2">
      <span class="drag-handle">☰</span>
      Development
    </li>

    <li class="sortable-item" draggable="true" data-id="3">
      <span class="drag-handle">☰</span>
      Testing
    </li>

    <li class="sortable-item" draggable="true" data-id="4">
      <span class="drag-handle">☰</span>
      Deployment
    </li>
  </ul>

  <button id="showOrderButton" type="button">
    Show current order
  </button>

  <p id="result"></p>

  <script>
    const list = document.getElementById("sortableList");
    const items = list.querySelectorAll(".sortable-item");
    const showOrderButton = document.getElementById("showOrderButton");
    const result = document.getElementById("result");

    items.forEach((item) => {
      item.addEventListener("dragstart", () => {
        item.classList.add("dragging");
      });

      item.addEventListener("dragend", () => {
        item.classList.remove("dragging");
      });
    });

    list.addEventListener("dragover", (event) => {
      // Required so that dropping is allowed.
      event.preventDefault();

      const draggingItem = list.querySelector(".dragging");
      const itemAfterCursor = getItemAfterCursor(list, event.clientY);

      if (!draggingItem) {
        return;
      }

      if (itemAfterCursor === null) {
        list.appendChild(draggingItem);
      } else {
        list.insertBefore(draggingItem, itemAfterCursor);
      }
    });

    function getItemAfterCursor(container, cursorY) {
      const nonDraggingItems = [
        ...container.querySelectorAll(
          ".sortable-item:not(.dragging)"
        )
      ];

      return nonDraggingItems.reduce(
        (closest, item) => {
          const itemBox = item.getBoundingClientRect();
          const offset =
            cursorY - itemBox.top - itemBox.height / 2;

          if (offset < 0 && offset > closest.offset) {
            return {
              offset: offset,
              element: item
            };
          }

          return closest;
        },
        {
          offset: Number.NEGATIVE_INFINITY,
          element: null
        }
      ).element;
    }

    showOrderButton.addEventListener("click", () => {
      const currentOrder = [
        ...list.querySelectorAll(".sortable-item")
      ].map((item) => ({
        id: item.dataset.id,
        name: item.textContent.trim()
      }));

      result.textContent = JSON.stringify(currentOrder);
      console.log("Current order:", currentOrder);
    });
  </script>
</body>
</html>
